<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard da Imobiliária</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
        }
        h2 {
            font-size: 18px;
            color: #34495e;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 30px;
        }
        button:hover {
            background-color: #1a252f;
        }
        .painel-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .painel-grid {
                grid-template-columns: 1fr 1fr 1fr;
            }
        }
        .coluna {
            background: #fdfdfd;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .card {
            background: #ecf0f1;
            margin-bottom: 10px;
            padding: 12px;
            border-left: 5px solid;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
        }
        .card.imovel { border-color: #27ae60; }
        .card.mensal { border-color: #e67e22; }
        .card.tipo { border-color: #9b59b6; }
        
        .valor { font-weight: bold; }
        .imovel .valor { color: #27ae60; }
        .mensal .valor { color: #e67e22; }
        .tipo .valor { color: #9b59b6; }
    </style>
</head>
<body>

    <div class="container">
        <h1>BANCO DE DADOS DE VENDAS</h1>
        <button onclick="carregarDashboard()">Atualizar Dados do Servidor</button>
        
        <div class="painel-grid">
            <!-- Coluna 1: Acumulado -->
            <div class="coluna">
                <h2>💰 Faturamento por Imóvel</h2>
                <div id="resultado-imoveis">A aguardar atualização...</div>
            </div>

            <!-- Coluna 2: Mensal -->
            <div class="coluna">
                <h2>📅 Vendas Mensais</h2>
                <div id="resultado-mensais">A aguardar atualização...</div>
            </div>

            <!-- Coluna 3: Percentual -->
            <div class="coluna">
                <h2>📊 Percentual por Tipo de venda</h2>
                <div id="resultado-tipos">A aguardar atualização...</div>
            </div>
        </div>
    </div>

    <script>
        async function carregarDashboard() {
            document.getElementById('resultado-imoveis').innerHTML = 'A carregar...';
            document.getElementById('resultado-mensais').innerHTML = 'A carregar...';
            document.getElementById('resultado-tipos').innerHTML = 'A carregar...';

            try {
                // 1. Pedido da Rota de Imóveis
                const resImoveis = await fetch('http://localhost:3000/api/imoveis/acumulado');
                const dadosImoveis = await resImoveis.json();
                let htmlImoveis = '';
                dadosImoveis.forEach(item => {
                    const chave = Object.keys(item)[0];
                    const valor = item[chave].toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    htmlImoveis += `<div class="card imovel"><span>Cód: ${chave}</span><span class="valor">${valor}</span></div>`;
                });
                document.getElementById('resultado-imoveis').innerHTML = htmlImoveis;

                // 2. Pedido da Rota de Vendas Mensais
                const resMensais = await fetch('http://localhost:3000/api/vendas/mensais');
                const dadosMensais = await resMensais.json();
                let htmlMensais = '';
                dadosMensais.forEach(item => {
                    const chave = Object.keys(item)[0];
                    const valor = item[chave].toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    htmlMensais += `<div class="card mensal"><span>${chave}</span><span class="valor">${valor}</span></div>`;
                });
                document.getElementById('resultado-mensais').innerHTML = htmlMensais;

                // 3. Pedido da Rota de Percentual por Tipo
                const resTipos = await fetch('http://localhost:3000/api/vendas/percentual-tipo');
                const dadosTipos = await resTipos.json();
                let htmlTipos = '';
                dadosTipos.forEach(item => {
                    const chave = Object.keys(item)[0];
                    const valor = item[chave]; // Já vem como string com "%" da API
                    htmlTipos += `<div class="card tipo"><span>${chave}</span><span class="valor">${valor}</span></div>`;
                });
                document.getElementById('resultado-tipos').innerHTML = htmlTipos;

            } catch (erro) {
                alert("Erro ao conectar à API. Verifica se o Node.js está ligado no terminal!\nDetalhe: " + erro.message);
            }
        }
    </script>
</body>
</html>
